services:
  mediawiki:
    container_name: hitchwiki-mediawiki
    build:
      context: .
      args:
        MW_VERSION: ${MW_VERSION}
    restart: always
    # Production-local: Caddy in /opt/hitchwiki-private fronts the site and reaches
    # the container over the private network below; MW_PORT is also published for
    # direct/host access. Never committed until now, which is why a restore from an
    # older working copy keeps dropping them — keep these two blocks in sync with prod.
    ports:
      - ${MW_PORT}:80
    networks:
      - default
      - hitchwiki_private_db
    volumes:
      # Configuration files and images
      - ./wiki/images:/var/www/html/images
      - ./data:/var/www/html/data:ro
      # maps.hitchwiki.org export directory (holds country_ratings.csv), mounted read-only
      # at the same path inside the container so HITCHABILITY_RATINGS_CSV resolves in both.
      # Mounting the directory rather than the CSV keeps the ratings optional: if maps
      # isn't deployed here, Docker just creates an empty dir and the extension degrades
      # to {{Unvalued}} instead of the container failing on a missing bind source.
      - ${HITCHABILITY_RATINGS_DIR}:${HITCHABILITY_RATINGS_DIR}:ro
      # OpenStreetMap raster tiles for the infobox maps, served from our own origin
      # at /tiles/{z}/{x}/{y}.png. Previously every one of ~4,500 article page views
      # fetched these straight from tile.openstreetmap.org, against the OSM tile
      # usage policy. Seeded and refreshed by tools/seed_map_tiles.py on the host;
      # read-only here because nothing in the wiki should ever write a tile.
      - ./tiles:/var/www/html/tiles:ro
      # Per-map hitchhiking spot data behind the infobox map pins, one small JSON
      # file per map window. Served from our own origin because maps.hitchwiki.org
      # sends no Access-Control-Allow-Origin, so fetching its spots.json from a
      # hitchwiki.org page would be blocked by CORS. Built by tools/build_map_spots.py.
      - ./spots:/var/www/html/spots:ro
      - ./wiki/LocalSettings.php:/var/www/html/LocalSettings.php
      - ./wiki/googlea8e45f716eafd720.html:/var/www/html/googlea8e45f716eafd720.html
      - ./wiki/google77220cfb918d56fd.html:/var/www/html/google77220cfb918d56fd.html
      - ./oauth/oauth2.key:/var/www/html/oauth2.key
      - ./oauth/oauth2.pub:/var/www/html/oauth2.pub
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  images:

networks:
  hitchwiki_private_db:
    external: true
    name: hitchwiki-private_private

